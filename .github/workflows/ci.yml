name: Sentinel Test & Quality Gate

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test_and_lint:
    name: "Python Test Matrix & Dry-Run"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        python-version: ["3.10", "3.11"]

    steps:
      - name: "Checkout Code"
        uses: actions/checkout@v7

      - name: "Setup Python ${{ matrix.python-version }}"
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: "Install Dependencies"
        run: |
          python -m pip install --upgrade pip
          pip install requests pydantic pytest pytest-mock ruff

      - name: "Lint Code"
        run: |
          ruff check .

      - name: "Execute Test Suite"
        run: |
          pytest tests/ -v

      - name: "Verify Dry-Run Execution"
        run: |
          python agent_watchdog.py --dry-run --output-dir briefings/
          ls -la briefings/